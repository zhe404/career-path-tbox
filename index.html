<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>AI职业导航 · 成长树</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    /* ... 原有样式保持不变，新增以下样式 ... */
    
    /* 优化进度条 */
    .optimize-progress {
      margin-top: 12px;
      padding: 12px 16px;
      background: rgba(255,255,255,0.6);
      border-radius: 12px;
      border: 1px solid #e5edf8;
      display: none;
    }
    .optimize-progress.show {
      display: block;
      animation: fadeUp 0.3s ease;
    }
    .optimize-progress .progress-bar-wrap {
      background: #e5edf8;
      border-radius: 8px;
      height: 8px;
      overflow: hidden;
      margin-top: 6px;
    }
    .optimize-progress .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #1e4a8a, #4a8bc2, #6ab0e6);
      border-radius: 8px;
      transition: width 0.5s ease;
    }
    .optimize-progress .progress-text {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #4a6f9c;
    }
    .optimize-progress .progress-text .status-icon {
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    
    /* 优化状态标签 */
    .status-badge {
      display: inline-block;
      padding: 2px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-left: 8px;
    }
    .status-badge.optimizing {
      background: #fff3cd;
      color: #856404;
    }
    .status-badge.done {
      background: #d4edda;
      color: #155724;
    }
    .status-badge.local {
      background: #e2e3e5;
      color: #383d41;
    }
    
    .btn-optimize {
      position: relative;
      transition: all 0.3s;
    }
    .btn-optimize:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .btn-optimize .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
<!-- ... 原有HTML结构保持不变 ... -->

<!-- 在 tab2 的按钮区域添加进度条 -->
<div class="flex mt-20" style="flex-wrap:wrap; gap:10px;">
  <button class="btn-secondary" id="regenerateBtn"><i class="fas fa-rotate-right"></i> 重新生成</button>
  <button class="btn-secondary btn-optimize" id="optimizeBtn">
    <i class="fas fa-magic"></i> 获取优化版
  </button>
  <button class="btn-secondary" id="consultBtn"><i class="fas fa-paper-plane"></i> 咨询AI助手</button>
</div>

<!-- 优化进度条 -->
<div id="optimizeProgress" class="optimize-progress">
  <div class="progress-text">
    <span><span class="status-icon">⏳</span> <span id="progressStatusText">AI优化中...</span></span>
    <span id="progressTimeText">等待中</span>
  </div>
  <div class="progress-bar-wrap">
    <div id="progressBarFill" class="progress-bar-fill" style="width: 0%;"></div>
  </div>
</div>

<!-- ... 其余内容保持不变 ... -->

<script>
// ============================================
// 优化后的前端逻辑
// ============================================

const $ = id => document.getElementById(id);
let currentPathData = null;
let currentSessionId = null;
let radarChart = null;
let selectedStyle = 'default';
let skillTimer = null;
let lastSkillKey = '';
let skillInProgress = false;
let optimizeTimer = null;
let optimizeAttempts = 0;
const MAX_OPTIMIZE_ATTEMPTS = 45; // 最多45次 ≈ 2.5分钟
let isOptimizing = false;

// ============================================
// 优化版 - 获取优化树
// ============================================
$('optimizeBtn').addEventListener('click', async function() {
  if (!currentSessionId) {
    alert('请先生成成长树');
    return;
  }
  
  if (isOptimizing) {
    alert('⏳ 优化正在进行中，请稍候...');
    return;
  }
  
  // 检查是否已经优化完成
  if (currentPathData && currentPathData._status && currentPathData._status.includes('✅')) {
    alert('✅ 已经是优化版本，无需重复获取');
    return;
  }
  
  isOptimizing = true;
  optimizeAttempts = 0;
  this.disabled = true;
  this.innerHTML = '<span class="spinner"></span> 优化中...';
  
  // 显示进度条
  const progressEl = $('optimizeProgress');
  progressEl.classList.add('show');
  $('progressBarFill').style.width = '0%';
  $('progressStatusText').textContent = '🤖 AI正在思考您的职业路径...';
  $('progressTimeText').textContent = '⏳ 预计 15-30 秒';
  
  // 开始轮询
  await pollForOptimization();
});

async function pollForOptimization() {
  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 10000);
    
    const res = await fetch(
      `${API_CONFIG.baseUrl}/api/get-optimized-tree/${currentSessionId}`,
      { signal: controller.signal }
    );
    clearTimeout(timeoutId);
    
    const data = await res.json();
    
    if (data.success && data.optimized) {
      // ✅ 优化完成
      currentPathData = data.data;
      renderTree(currentPathData, getUserInput());
      
      // 更新进度条
      $('progressBarFill').style.width = '100%';
      $('progressStatusText').textContent = '✅ 优化完成！';
      $('progressTimeText').textContent = '🎉 已就绪';
      
      // 延迟隐藏进度条
      setTimeout(() => {
        $('optimizeProgress').classList.remove('show');
      }, 2000);
      
      // 恢复按钮状态
      $('optimizeBtn').disabled = false;
      $('optimizeBtn').innerHTML = '<i class="fas fa-magic"></i> 已优化 ✓';
      isOptimizing = false;
      
      // 显示成功提示
      showToast('✅ 职业成长树已优化完成！', 'success');
      return;
    }
    
    // 还没完成，继续轮询
    optimizeAttempts++;
    
    // 更新进度
    const progress = Math.min(95, (optimizeAttempts / MAX_OPTIMIZE_ATTEMPTS) * 100);
    $('progressBarFill').style.width = progress + '%';
    
    // 更新状态文字
    const messages = [
      '🤖 AI正在分析您的职业背景...',
      '📊 正在规划成长路径...',
      '🎯 正在匹配技能与目标...',
      '✨ 正在优化分支细节...',
      '🌟 即将完成...'
    ];
    const msgIndex = Math.min(Math.floor(optimizeAttempts / 5), messages.length - 1);
    $('progressStatusText').textContent = messages[msgIndex] || '⏳ 优化中...';
    
    // 计算剩余时间
    const remaining = data.remaining || Math.max(0, 30 - optimizeAttempts * 1.5);
    $('progressTimeText').textContent = `⏳ 约 ${Math.ceil(remaining)} 秒`;
    
    if (optimizeAttempts >= MAX_OPTIMIZE_ATTEMPTS) {
      // 超时 - 使用本地版本
      $('progressBarFill').style.width = '100%';
      $('progressStatusText').textContent = '⏳ 优化超时，使用本地版本';
      $('progressTimeText').textContent = '📋 已就绪';
      
      const localData = generateLocalTreeEnhanced(getUserInput());
      currentPathData = localData;
      renderTree(localData, getUserInput());
      
      setTimeout(() => {
        $('optimizeProgress').classList.remove('show');
      }, 2000);
      
      $('optimizeBtn').disabled = false;
      $('optimizeBtn').innerHTML = '<i class="fas fa-magic"></i> 本地版';
      isOptimizing = false;
      
      showToast('⏳ 优化超时，已使用本地生成版本', 'warning');
      return;
    }
    
    // 动态调整轮询间隔
    let interval = 2000;
    if (optimizeAttempts > 10) interval = 3000;
    if (optimizeAttempts > 20) interval = 4000;
    
    setTimeout(pollForOptimization, interval);
    
  } catch (error) {
    console.error('轮询失败:', error);
    optimizeAttempts++;
    if (optimizeAttempts < MAX_OPTIMIZE_ATTEMPTS) {
      setTimeout(pollForOptimization, 3000);
    } else {
      $('optimizeBtn').disabled = false;
      $('optimizeBtn').innerHTML = '<i class="fas fa-magic"></i> 重试';
      isOptimizing = false;
      $('optimizeProgress').classList.remove('show');
      showToast('❌ 连接失败，请点击"获取优化版"重试', 'error');
    }
  }
}

// ============================================
// Toast 提示组件
// ============================================
function showToast(message, type = 'info') {
  const colors = {
    success: '#d4edda',
    warning: '#fff3cd',
    error: '#f8d7da',
    info: '#d1ecf1'
  };
  const textColors = {
    success: '#155724',
    warning: '#856404',
    error: '#721c24',
    info: '#0c5460'
  };
  
  const toast = document.createElement('div');
  toast.style.cssText = `
    position: fixed;
    top: 20px;
    right: 20px;
    background: ${colors[type] || '#fff'};
    color: ${textColors[type] || '#333'};
    padding: 14px 24px;
    border-radius: 12px;
    border: 1px solid ${colors[type] || '#ddd'};
    box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    z-index: 999999;
    max-width: 400px;
    font-size: 14px;
    font-weight: 500;
    animation: slideIn 0.3s ease;
    transition: opacity 0.3s;
  `;
  toast.textContent = message;
  document.body.appendChild(toast);
  
  setTimeout(() => {
    toast.style.opacity = '0';
    setTimeout(() => toast.remove(), 300);
  }, 4000);
}

// 添加滑入动画
const styleSheet = document.createElement('style');
styleSheet.textContent = `
  @keyframes slideIn {
    from { transform: translateX(100px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
`;
document.head.appendChild(styleSheet);

// ============================================
// 本地生成树（增强版）
// ============================================
function generateLocalTreeEnhanced(input) {
  const targetYears = parseInt(input.targetYears) || 5;
  const workYears = parseInt(input.years) || 0;
  const icons = ['📚','📝','💡','👥','🏆','🌐','🎯','🌟','🏛️','💎'];
  const milestones = [
    '建立基础能力',
    '独立承担项目', 
    '成为团队骨干',
    '带领小团队',
    '独当一面',
    '拓展影响力',
    '行业专家',
    '战略视野',
    '引领创新',
    '成就卓越'
  ];
  const goals = [
    '掌握核心技能，适应职场节奏',
    '深化专业能力，建立个人品牌',
    '拓展人脉资源，提升影响力',
    '培养管理能力，开始带团队',
    '成为领域专家，输出方法论',
    '跨界学习，拓宽职业边界',
    '建立行业影响力',
    '战略思维与全局观',
    '引领行业创新',
    '实现职业理想'
  ];
  
  const branches = [];
  for (let i = 1; i <= targetYears; i++) {
    const idx = Math.min(i - 1, goals.length - 1);
    branches.push({
      year: i,
      icon: icons[idx % icons.length],
      title: `第${i}年 · ${input.job || '职业成长'}`,
      goals: goals[idx] || '持续成长',
      skills: ['专业技能', '沟通协作', '持续学习'].slice(0, Math.min(3, i)),
      milestone: milestones[idx] || `第${i}年里程碑`
    });
  }
  
  return {
    tree: { branches },
    radarData: { 
      skill: Math.min(90, 40 + workYears * 8 + targetYears * 2), 
      experience: Math.min(95, workYears * 12 + targetYears * 3), 
      learning: 85, 
      adaptability: 70, 
      leadership: Math.min(80, workYears * 5 + targetYears * 3) 
    },
    challenges: { 
      icon: '⚡', 
      text: '持续学习，把握机遇，在变化中成长' 
    },
    badges: ['🎯 目标清晰', '📈 持续成长', '💪 潜力无限', '🌟 未来可期'],
    _isTemplate: false,
    _status: '📋 本地生成',
    _source: 'local'
  };
}

// ============================================
// 覆盖 renderTree 添加状态显示
// ============================================
const originalRenderTree = renderTree;
renderTree = function(data, input) {
  // 调用原有渲染
  originalRenderTree(data, input);
  
  // 添加状态标签
  const summary = $('profileSummary');
  if (summary && data._status) {
    const statusClass = data._status.includes('✅') ? 'done' : 
                        data._status.includes('本地') ? 'local' : 'optimizing';
    const statusSpan = document.createElement('span');
    statusSpan.className = `status-badge ${statusClass}`;
    statusSpan.textContent = data._status || '';
    summary.appendChild(statusSpan);
  }
};

// ============================================
// 优化生成按钮 - 显示进度
// ============================================
const originalGenerate = $('generateBtn').click;
$('generateBtn').addEventListener('click', async function() {
  // 重置优化状态
  isOptimizing = false;
  optimizeAttempts = 0;
  $('optimizeProgress').classList.remove('show');
  $('optimizeBtn').disabled = false;
  $('optimizeBtn').innerHTML = '<i class="fas fa-magic"></i> 获取优化版';
  
  // 调用原有逻辑
  const input = getUserInput();
  if (!input.job) { alert('请选择职业'); return; }
  if (input.skills.length < 3) { alert('请至少选择3项技能'); return; }
  
  this.disabled = true;
  this.innerHTML = '<span class="spinner"></span> 生成中...';
  
  try {
    const res = await fetch(`${API_CONFIG.baseUrl}/api/generate-tree`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(input)
    });
    const data = await res.json();
    
    if (data.success) {
      currentPathData = data.data;
      currentSessionId = data.sessionId;
      renderTree(data.data, input);
      switchTab('tab2');
      
      // 提示AI正在优化
      if (data.template) {
        showToast('🌳 初始版本已生成，AI正在后台优化...', 'info');
        // 自动开始优化
        setTimeout(() => {
          $('optimizeBtn').click();
        }, 1000);
      }
    }
  } catch(e) {
    const fb = generateLocalTreeEnhanced(input);
    currentPathData = fb;
    renderTree(fb, input);
    switchTab('tab2');
    showToast('📋 使用本地版本', 'warning');
  } finally {
    this.disabled = false;
    this.innerHTML = '<i class="fas fa-wand-magic-sparkles"></i> 🌳 生成我的职业成长树';
  }
});

// 其他原有函数保持不变...
// (JOB_CASCADE, openCascade, closeCascade, recommendSkills, etc.)

</script>
</body>
</html>
